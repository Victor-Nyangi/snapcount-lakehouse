name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Milestone 1 CI never touches AWS: no credentials, no plan, no dbt run.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
