name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Milestone 1 CI never touches AWS: no credentials, no plan, no dbt run.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # dbt parse needs the adapter and a profile but no connection; LAKE_BUCKET is a
      # placeholder because profiles.yml reads it. dbt compile/run would need Athena.
      - run: uv run dbt parse --project-dir transform --profiles-dir transform
        env:
          LAKE_BUCKET: parse-only
      - run: uv run sqlfluff lint transform/models transform/tests --dialect athena

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/lake init -backend=false -input=false
      - run: terraform -chdir=infra/lake validate
      # mock_provider: plan-only, no credentials, no AWS calls.
      - run: terraform -chdir=infra/lake test
