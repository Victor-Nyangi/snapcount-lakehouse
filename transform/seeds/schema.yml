version: 2

seeds:
  - name: teams
    description: snapcount's 32 canonical teams (backend/app/data/teams.json).
    columns:
      - name: abbr
        data_tests: [unique, not_null]

  - name: team_abbr_map
    description: >
      Feed abbreviation -> canonical abbr, snapcount's ABBR_MAP. Schedules keep the code a
      team used at kickoff (LA, SD, OAK); player stats are mostly normalised already.
    columns:
      - name: feed_abbr
        data_tests: [unique, not_null]
      - name: abbr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: abbr

  - name: parity_expected_2025
    description: >
      Generated by scripts/parity_from_snapcount.py from snapcount's backfill dump. Do not
      hand-edit; regenerate. Read by the singular tests in tests/parity_*.sql.
    config:
      column_types:
        metric: string
        key: string
        expected: string
    columns:
      - name: metric
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["games", "player_seasons", "team_record"]
      - name: key
        data_tests: [not_null]
      - name: expected
        data_tests: [not_null]
